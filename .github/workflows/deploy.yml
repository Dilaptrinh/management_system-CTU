name: Automated Deployment via Tailscale

on:
  push:
    branches:
      - main

jobs:
  deploy-web:
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Lấy mã nguồn từ kho chứa GitHub nạp vào máy ảo
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Bước 2: Dùng Auth Key để máy ảo kết nối vào mạng Mesh VPN của Tailscale
      - name: Connect to Tailscale Network
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      # Bước 3: Đẩy file qua giao thức mã hóa SCP sử dụng IP nội bộ Tailscale
      - name: Sync Files to Server via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "./*"
          target: "/var/www/ctu"

      # Bước 4: SSH vào Server phát lệnh tải lại cấu hình NGINX
      - name: Reload NGINX Web Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo systemctl reload nginx